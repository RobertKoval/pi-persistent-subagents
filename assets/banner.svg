<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">Pi Persistent Subagents</title><desc id="desc">One manager, three persistent workers. The same process stays ready for the next task.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#091119"/></linearGradient><linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient></defs>
<rect width="1280" height="360" rx="24" fill="url(#bg)"/>
<g fill="none" stroke="#263548" opacity=".5"><path d="M0 300H1280M0 240H1280M0 180H1280M0 120H1280M0 60H1280"/><path d="M640 0V360M760 0V360M880 0V360M1000 0V360M1120 0V360M1240 0V360"/></g>
<rect x="54" y="48" width="139" height="28" rx="14" fill="#193332"/><text x="70" y="67" fill="#5eead4" font-family="monospace" font-size="12" letter-spacing="2">PI EXTENSION</text>
<text x="54" y="146" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="55" font-weight="700">A team that stays.</text>
<text x="56" y="191" fill="#a8b7c9" font-family="Arial,sans-serif" font-size="22">Persistent workers. Continuous context.</text>
<text x="56" y="274" fill="url(#accent)" font-family="monospace" font-size="17">spawn → work → idle → continue</text>
<text x="56" y="309" fill="#73859b" font-family="monospace" font-size="13">SAME PROCESS · SAME SESSION · YOUR CONTROL</text>
<g stroke="#4b6b82" stroke-width="2" fill="none"><path d="M835 180H887V86H942M887 180H942M887 180V274H942"/></g>
<rect x="709" y="148" width="134" height="64" rx="13" fill="#182335" stroke="#7183c2"/>
<text x="776" y="187" fill="#c7d2fe" text-anchor="middle" font-family="monospace" font-size="17">manager</text>
<g fill="#112c2b" stroke="#30675e"><rect x="943" y="53" width="272" height="66" rx="12"/><rect x="943" y="147" width="272" height="66" rx="12"/><rect x="943" y="241" width="272" height="66" rx="12"/></g>
<g fill="#5eead4"><circle cx="967" cy="86" r="4"/><circle cx="967" cy="180" r="4"/><circle cx="967" cy="274" r="4"/></g>
<g fill="#d7f3ed" font-family="monospace" font-size="16"><text x="984" y="92">coder</text><text x="984" y="186">reviewer</text><text x="984" y="280">explorer</text></g>
<g fill="#80bcb0" text-anchor="end" font-family="monospace" font-size="12"><text x="1193" y="91">↻ ready</text><text x="1193" y="185">↻ ready</text><text x="1193" y="279">↻ ready</text></g>
</svg>
